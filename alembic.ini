# =====================================================================================
#  Alembic configuration.
#
#  The database URL is NOT configured here. `migrations/env.py` reads it from the
#  application's own Settings (`ACTIVE_DATABASE` / `DATABASE_URL`), so there is only
#  ever one place to configure a target and the migration cannot drift from the app.
#
#  Usage:
#    alembic upgrade head              apply every pending migration
#    alembic downgrade -1             undo the last one
#    alembic revision --autogenerate -m "add x"
#    alembic current                  which revision is applied
#    alembic history                  the revision graph
#
#  `make migrate` wraps the first of these.
# =====================================================================================
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .

# Multi-database: one URL per named target, e.g. `alembic -x db=mysql upgrade head`.
# When `db` is not given, migrations/env.py falls back to ACTIVE_DATABASE.
databases = postgres, mysql, sqlite

# Timestamped revision filenames, so the ordering is visible in the directory listing.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
# Keep the generated migrations formatted the same way as the rest of the codebase.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = %(here)s/.venv/bin/ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
