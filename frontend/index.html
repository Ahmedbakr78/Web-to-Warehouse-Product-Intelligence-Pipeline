<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Product Intelligence Pipeline - analytics dashboard for the Web-to-Warehouse ETL platform" />
    <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <script>
      // Resolve the persisted appearance before first paint so the app never
      // flashes the wrong theme. Mirrors src/lib/theme.ts.
      ;(function () {
        try {
          var root = document.documentElement
          var stored = localStorage.getItem('pip.theme') || 'system'
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var dark =
            stored === 'dark' || stored === 'midnight' || stored === 'high-contrast' ||
            (stored === 'system' && prefersDark)
          root.classList.toggle('dark', dark)
          root.classList.toggle('theme-midnight', stored === 'midnight')
          root.classList.toggle('theme-high-contrast', stored === 'high-contrast')
          root.dataset.theme = stored
          root.style.colorScheme = dark ? 'dark' : 'light'

          root.dataset.density = localStorage.getItem('pip.density') || 'comfortable'

          var motion = localStorage.getItem('pip.motion') || 'full'
          root.dataset.motion = motion === 'auto' ? 'full' : motion

          var scale = localStorage.getItem('pip.fontScale') || 'md'
          root.dataset.fontScale = scale
          var sizes = { xs: '13px', sm: '15px', md: '16px', lg: '17.5px', xl: '19px' }
          root.style.setProperty('--app-font-size', sizes[scale] || sizes.md)

          var direction = localStorage.getItem('pip.direction') || 'ltr'
          root.dataset.direction = direction
          root.setAttribute('dir', direction)

          root.dataset.accent = localStorage.getItem('pip.accent') || 'indigo'

          // Paint the accent before first paint too: the CSS variables are
          // otherwise set only once React boots, flashing the default indigo.
          var accents = {
            indigo: ['#4f46e5', 'rgb(99 102 241 / 0.12)'],
            blue: ['#2563eb', 'rgb(37 99 235 / 0.12)'],
            sky: ['#0284c7', 'rgb(2 132 199 / 0.12)'],
            cyan: ['#0891b2', 'rgb(8 145 178 / 0.12)'],
            teal: ['#0d9488', 'rgb(13 148 136 / 0.12)'],
            emerald: ['#059669', 'rgb(5 150 105 / 0.12)'],
            green: ['#16a34a', 'rgb(22 163 74 / 0.12)'],
            amber: ['#d97706', 'rgb(217 119 6 / 0.12)'],
            orange: ['#ea580c', 'rgb(234 88 12 / 0.12)'],
            rose: ['#e11d48', 'rgb(225 29 72 / 0.12)'],
            pink: ['#db2777', 'rgb(219 39 119 / 0.12)'],
            violet: ['#7c3aed', 'rgb(124 58 237 / 0.12)']
          }
          var accent = accents[root.dataset.accent] || accents.indigo
          root.style.setProperty('--brand-500', accent[0])
          root.style.setProperty('--brand-600', accent[0])
          root.style.setProperty('--brand-500-soft', accent[1])

          // The browser picks a theme-color meta by OS setting, not by app theme,
          // so resolve it here for the actual (possibly system-derived) mode.
          var metas = document.querySelectorAll('meta[name="theme-color"]')
          for (var i = 0; i < metas.length; i++) {
            metas[i].setAttribute('content', dark ? '#0b0f19' : '#ffffff')
          }
        } catch (error) {
          /* storage blocked - fall back to the light default */
        }
      })()
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pipeline" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Product Intelligence Pipeline</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="1024x1024" href="/logo.png" />
    
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
