name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -e ".[postgres,mysql,dev]"

      - name: Ruff lint
        run: ruff check app tests scripts dags

      - name: Ruff format check
        run: ruff format --check app tests scripts dags

      - name: Mypy type check
        run: mypy app

      - name: Unit tests (SQLite, no services needed)
        run: pytest -q

  frontend:
    name: Frontend - lint, types, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint (zero warnings allowed)
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: frontend/dist
          retention-days: 7
