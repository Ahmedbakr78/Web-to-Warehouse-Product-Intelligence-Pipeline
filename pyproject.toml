[project]
name = "product-intelligence-pipeline"
version = "1.5.0"
description = "Web-to-Warehouse Product Intelligence Pipeline: compliant scraping, standardization, deduplication, and analytical loading of product data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ahmed Abobakr", email = "ahmed.bakr@depi.local" }]
keywords = ["etl", "scraping", "airflow", "data-warehouse", "fastapi", "data-quality"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "lxml-html-clean>=0.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "plotly>=5.22",
    "python-dateutil>=2.9",
    "python-multipart>=0.0.9",
    "PyJWT>=2.8",
    "argon2-cffi>=23.1",
    "email-validator>=2.1",
    "orjson>=3.10",
    "tenacity>=8.3",
    "structlog>=24.1",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9", "SQLAlchemy>=2.0.30"]
mysql = ["PyMySQL>=1.1", "cryptography>=42.0"]
sqlite = []
airflow = ["apache-airflow>=2.9"]
scrapy = ["scrapy>=2.11", "itemloaders>=1.3", "scrapy-rotating-proxies>=0.13"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
]
all = [
    "psycopg2-binary>=2.9",
    "PyMySQL>=1.1",
    "cryptography>=42.0",
    "apache-airflow>=2.9",
    "scrapy>=2.11",
]

[project.scripts]
pip-cli = "app.cli.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = [".venv", "frontend", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "SIM108"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
markers = [
    "integration: tests requiring a live database or HTTP server",
    "slow: long running tests",
]
filterwarnings = ["ignore::DeprecationWarning"]